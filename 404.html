<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Lance Fora da Quadra | ADESP/CDHU Uberlândia</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="Imagens/CDHU.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0A509E;
            --primary-green: #1F8A4D;
            --accent-gold: #F4C542;
            --bg-dark: #07162c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #0d284e 0%, #061120 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .error-card {
            max-width: 650px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .error-logo {
            width: 90px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 12px rgba(244, 197, 66, 0.3));
        }
        .error-code {
            font-family: 'Oswald', sans-serif;
            font-size: 6.5rem;
            line-height: 1;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .error-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .error-desc {
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .btn-home {
            background: linear-gradient(135deg, var(--primary-green), #27ae60);
            color: white;
            box-shadow: 0 6px 20px rgba(31, 138, 77, 0.4);
        }
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(31, 138, 77, 0.6);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <img src="Imagens/CDHU.png" alt="Escudo ADESP/CDHU" class="error-logo" onerror="this.src='Imagens/ADESPCDHU.png'">
        <div class="error-code">404</div>
        <h1 class="error-title">Lance Fora da Quadra!</h1>
        <p class="error-desc">
            A bola saiu pelas laterais ou a página que você tentou acessar não existe mais. 
            Mas o jogo não para! Volte para a nossa quadra principal.
        </p>
        <div class="btn-group">
            <a href="index.html#home" class="btn btn-home"><i class="fas fa-arrow-left"></i> Voltar ao Início</a>
            <a href="index.html#jogos" class="btn btn-secondary"><i class="fas fa-calendar-alt"></i> Ver Jogos</a>
        </div>
    </div>
</body>
</html>
